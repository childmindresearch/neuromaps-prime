NMT2Asym:
  species: macaque
  description: NMT v2 Asymmetric Macaque Template
  references:
  - citation: Jung, B, et al. 2021. NeuroImage, 235:117997
    doi: 10.1016/j.neuroimage.2021.117997
  - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
    url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
  surfaces:
    41k:
      sphere:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_sphere.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_sphere.surf.gii
      midthickness:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_midthickness.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_midthickness.surf.gii
      white:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_white.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_white.surf.gii
      pial:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_pial.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_pial.surf.gii
      inflated:
        left: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6ab1d19f52671ca676b2a5fa
        right: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6ab1d19fe3bee888a5845480
      annotation:
        IT:
          left: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6aa04a8af76da4eb19405682
          right: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6aa04a848806c160454058cd
          references:
          - citation: Manea, A, et al. 2022. eLife, 11:e75540.
            doi: 10.7554/eLife.75540
          notes:
          - Intrinsic timescale; sum of ACF values in the initial positive period, projected onto the cortical surface.
        CV_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_curvature.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_curvature.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - FreeSurfer mean curvature computed on the supplied white surface, with template-specific smoothing.
        CT_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_thickness.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_thickness.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - FreeSurfer cortical thickness computed with neighborhood size 20 and a 5 mm limit.
        SD_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_sulc.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_sulc.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - DPF-derived sulcal folding field computed with brain-slam 0.1.2, alpha=0.03; not a direct geometric depth measurement.
        BM_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-L_cortexmask.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/NMT2Asym/src-NMT2Asym_den-41k_hemi-R_cortexmask.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - 'Consensus cortex mask: 1=cortex, 0=medial wall. Fetching this annotation does not automatically apply an ROI during resampling or comparison.'
  volumes:
    750um:
      T1w: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6ab1d8ea977c2187a7845046
      annotation:
        IT:
          uri: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6aa04faefa47ed7a6e48642b
          references:
          - citation: Manea, A, et al. 2022. eLife, 11:e75540.
            doi: 10.7554/eLife.75540
          notes:
          - Sum of ACF values in the initial positive period; Higher = longer timescale.
        IT_lag1:
          uri: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6aa050393bb7733d8b06f774
          references:
          - citation: Manea, A, et al. 2022. eLife, 11:e75540.
            doi: 10.7554/eLife.75540
          notes:
          - Magnitude of ACF at a single time lag.
        IT_zerocrossinglag:
          uri: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6aa050399ddaffe341a71dab
          references:
          - citation: Manea, A, et al. 2022. eLife, 11:e75540.
            doi: 10.7554/eLife.75540
          notes:
          - Number of lags until the ACF first crosses zero.
        IT_timeconstant:
          uri: https://files.us.osf.io/v1/resources/nmxfh/providers/osfstorage/6aa0503925cf3cd9eb48640c
          references:
          - citation: Manea, A, et al. 2022. eLife, 11:e75540.
            doi: 10.7554/eLife.75540
          notes:
          - Time unit version of the timescale (zero crossing lag x TR 1.1s)


