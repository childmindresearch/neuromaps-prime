CIVETNMT:
  species: macaque
  description: CIVET Non-human Primate Template
  references:
  - citation: Lepage, C., et al. 2021. Organization for Human Brain Mapping
    doi: 10.1016/j.neuroimage.2020.117622
  - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
    url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
  surfaces:
    41k:
      sphere:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_sphere.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_sphere.surf.gii
      midthickness:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_midthickness.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_midthickness.surf.gii
      white:
        left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_white.surf.gii
        right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_white.surf.gii
      annotation:
        CV_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_curvature.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_curvature.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - FreeSurfer mean curvature computed on the supplied white surface, with template-specific smoothing.
        CT_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_thickness.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_thickness.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - 'Estimated cortical thickness: twice the distance between corresponding white and midthickness vertices.'
        SD_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_sulc.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_sulc.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - DPF-derived sulcal folding field computed with brain-slam 0.1.2, alpha=0.03; not a direct geometric depth measurement.
        BM_RheMAPSurf:
          left: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-L_cortexmask.shape.gii
          right: https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/CIVETNMT/src-CIVETNMT_den-41k_hemi-R_cortexmask.shape.gii
          references:
          - citation: 'RheMAP-Surf resources: macaque template surfaces, cortical maps, and spherical registrations.'
            url: https://github.com/zhouzx-UCAS/RheMAP-Surf-resources
          notes:
          - 'Consensus cortex mask: 1=cortex, 0=medial wall. Fetching this annotation does not automatically apply an ROI during resampling or comparison.'
