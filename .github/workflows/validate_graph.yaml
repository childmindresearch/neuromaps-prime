name: Validate graph YAMLs
permissions:
  contents: read

on:
  push:
    branches:
    - main
    paths:
    - src/neuromaps_prime/resources/**/*.yaml
    - schemas/**/neuromaps_*.schema.json
    - .github/workflows/validate_graph.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
    - src/neuromaps_prime/resources/**/*.yaml
    - schemas/**/neuromaps_*.schema.json
    - .github/workflows/validate_graph.yaml

jobs:
  validate:
    name: Validate graph YAML
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.2.0

    - name: Validate nodes
      run: |
        find src/neuromaps_prime/resources/nodes -name "*.yaml" \
          -exec uv run --only-group validate check-jsonschema \
            --schemafile schemas/neuromaps_nodes.schema.json \
            --verbose {} +

    - name: Validate surface edges
      run: |
        find src/neuromaps_prime/resources/edges/surface -name "*.yaml" \
          -exec uv run --only-group validate check-jsonschema \
            --schemafile schemas/neuromaps_surface_edges.schema.json \
            --verbose {} +

    - name: Validate volume edges
      run: |
        find src/neuromaps_prime/resources/edges/volume -name "*.yaml" \
          -exec uv run --only-group validate check-jsonschema \
            --schemafile schemas/neuromaps_volume_edges.schema.json \
            --verbose {} +

    - name: Validate URLs
      if: github.event.pull_request.draft == false
      run: |
        shopt -s globstar
        uv run --script scripts/validate_urls.py \
          src/neuromaps_prime/resources/**/*.yaml \
          --workers 2 \
          --skip gin.g-node.org \
          --allow-shared-url https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/F99/src-F99_den-74k_hemi-L_sphere.surf.gii \
          --allow-shared-url https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/F99/src-F99_den-74k_hemi-R_sphere.surf.gii \
          --allow-shared-url https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/Yerkes19/src-Yerkes19_den-32k_hemi-L_sphere.surf.gii \
          --allow-shared-url https://raw.githubusercontent.com/zhouzx-UCAS/RheMAP-Surf-resources/main/surfaces/Yerkes19/src-Yerkes19_den-32k_hemi-R_sphere.surf.gii
